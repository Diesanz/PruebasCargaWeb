<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <title>Inicio Sesion</title>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
        <link rel="stylesheet" href="{{ url_for('static', filename='css/inicioSesion.css') }}">
    </head>
    <body>
        <header><a class="material-symbols-outlined" href="/">arrow_back</a></header>

        <div class="caja">

            <div id="mensaje-error" style="display:none; color: red;"></div>
            <p>Login EATTHIS</p>
            
            <form id="loginForm">
                
                <p class="izquierda">
                    <label for="email">Correo electrónico</label>
                    <input class="input" type="email" name="email" id="email">
                </p>
                
                <p class="izquierda">
                    <label for="password">Contraseña</label>
                    <input class="input" type="password" name="password" id="password">
                </p>
                
                
                <div class="opciones">
                    <div>
                        Recuerdame
                        <input type="checkbox" name="remember" id="remember">
                    </div>
                </div>


                <p>
                    <input type="submit" class="btn btn-login" name="btn-login" value="Iniciar Sesion">
                </p>
                <p>
                    <a href="/api/registro" class="btn btn-login">Registrarse</a>
                </p>

                <div class="redes">
                    <span>Elige cualquier otro metodo de identificacion</span>
                    <button class="btn btn-google">Google</button>
                    <button class="btn btn-facebook">Facebook</button>
                    <button class="btn btn-twitter">Twitter</button>
                </div>
            </form>
            <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
        </div>
    </body>
</html>
