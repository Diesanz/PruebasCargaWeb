<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Error {{ error }}</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                text-align: center;
                padding: 5%;
                background-color: #f8f8f8;
            }
            .error-box {
                background: white;
                padding: 4%;
                border-radius: 2%;
                box-shadow: 0 0 1% rgba(0, 0, 0, 0.1);
                display: inline-block;
            }
            h1 {
                color: #e74c3c;
                font-size: 2em;
            }
        </style>
    </head>
    <body>
        <div class="error-box">
            <h1>Error {{ error }}</h1>
            <p>{{ mensaje }}</p>
            <a href="/">Volver al inicio</a>
        </div>
    </body>
</html>
